{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}SondageApp{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'sondage/css/styles.css' %}" />
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Sidebar -->
    <div class="d-flex">
        <nav class="bg-light p-4" style="width: 250px; min-height: 100vh;">
            <div class="text-center mb-4">
                <img src="{% static 'sondage/images/avatar.png' %}" class="rounded-circle img-thumbnail mb-2" width="80" height="80" alt="Profil">
                <h5>Utilisateur</h5>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="#" class="nav-link text-dark">🏠 Accueil</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-dark">➕ Création de sondage</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-dark">📊 Voir résultats</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-dark">🕘 Mes historiques</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-dark">👥 Les participants</a></li>
            </ul>
        </nav>

        <!-- Main content -->
        <main class="flex-grow-1 p-4">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <!-- Footer -->
    <footer class="text-center text-muted py-3 bg-light mt-auto">
        &copy; {{ year|default:2025 }} SondageApp - Tous droits réservés.
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
