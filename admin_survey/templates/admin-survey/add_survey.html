{% block content %}
  
<div class="container mt-5">
    <h2>Créer un Sondage</h2>
    <form id="surveyForm">
        <!-- Survey Details -->
        <div class="form-group">
            <label for="title_survey">Titre du Sondage</label>
            <input type="text" class="form-control" id="title_survey" name="title_survey" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
        </div>
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="start_date">Date de Début</label>
                <input type="date" class="form-control" id="start_date" name="start_date" required>
            </div>
            <div class="form-group col-md-6">
                <label for="end_date">Date de Fin</label>
                <input type="date" class="form-control" id="end_date" name="end_date" required>
            </div>
        </div>

        <!-- Questions Section -->
        <div id="questionsContainer">
            <div class="question-group">
                <h4>Question 1</h4>
                <div class="form-group">
                    <label for="title_question_1">Titre de la Question</label>
                    <input type="text" class="form-control" name="questions[0][title_question]" required>
                </div>
                <div class="form-group">
                    <label for="type_answer_1">Type de Réponse</label>
                    <select class="form-control" name="questions[0][type_answer]" required>
                        <option value="unique">Réponse unique</option>
                        <option value="multiple">Réponse multiple</option>
                        <option value="ouverte">Réponse texte ouverte</option>
                    </select>
                </div>
                <!-- Choices for this question -->
                <div id="choicesContainer_1">
                    <div class="choice-group">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" name="questions[0][choices][0][answer_text]" placeholder="Réponse">
                            <div class="input-group-append">
                                <button class="btn btn-outline-secondary remove-btn" type="button">Supprimer</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-link" onclick="addChoice(1)">Ajouter une Réponse</button>
            </div>
        </div>
        <button type="button" class="btn btn-secondary" onclick="addQuestion()">Ajouter une Question</button>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary mt-3">Créer le Sondage</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    let questionCount = 1;

    function addQuestion() {
        questionCount++;
        const questionHtml = `
            <div class="question-group">
                <h4>Question ${questionCount}</h4>
                <div class="form-group">
                    <label>Titre de la Question</label>
                    <input type="text" class="form-control" name="questions[${questionCount-1}][title_question]" required>
                </div>
                <div class="form-group">
                    <label>Type de Réponse</label>
                    <select class="form-control" name="questions[${questionCount-1}][type_answer]" required>
                        <option value="unique">Réponse unique</option>
                        <option value="multiple">Réponse multiple</option>
                        <option value="ouverte">Réponse texte ouverte</option>
                    </select>
                </div>
                <div id="choicesContainer_${questionCount}">
                    <div class="choice-group">
                        <div class="input-group mb-3">
                            <input type="text" class="form-control" name="questions[${questionCount-1}][choices][0][answer_text]" placeholder="Réponse">
                            <div class="input-group-append">
                                <button class="btn btn-outline-secondary remove-btn" type="button">Supprimer</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-link" onclick="addChoice(${questionCount})">Ajouter une Réponse</button>
            </div>`;
        $('#questionsContainer').append(questionHtml);
    }

    function addChoice(questionIndex) {
        const choiceCount = $(`#choicesContainer_${questionIndex} .choice-group`).length;
        const choiceHtml = `
            <div class="choice-group">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" name="questions[${questionIndex-1}][choices][${choiceCount}][answer_text]" placeholder="Réponse">
                    <div class="input-group-append">
                        <button class="btn btn-outline-secondary remove-btn" type="button">Supprimer</button>
                    </div>
                </div>
            </div>`;
        $(`#choicesContainer_${questionIndex}`).append(choiceHtml);
    }

    $(document).on('click', '.remove-btn', function() {
        $(this).closest('.choice-group').remove();
    });
</script>


{% endblock %} %}
