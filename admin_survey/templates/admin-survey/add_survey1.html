<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
  <body>
        <div class="container">
            <form action="" method="post">
                {%csrf_token%}
                <div class="form-group survey-group">
                    {{surveyform.as_p}}
                </div>

                <div class="form-group question-group">
                    {{questionform.as_p}}
                </div>

                <div class="choiceform-group">
                    {{choiceform.management_form}}
                    
                    {%for form in choiceform%}
                        <div class="form-group formset-item">
                            {{form.answer_text}}
                        </div>
                    {%endfor%}
                </div>

                <div class="btn btn-primary add_btn">ajouter un nouveau champ</div>
                <button class="btn btn-success">Enregistrer</button>
            </form>

            <script>
                const containerChoiceForm = document.querySelector('.choiceform-group');
                const totalForm = document.querySelectorAll('.formset-item').length;
                const btn_add = document.querySelector('.add_btn');
                const value_forms_output = document.getElementById('id_form-TOTAL_FORMS');
               
                let count = parseInt(totalForm);
                        
                btn_add.addEventListener('click', function() {
            
                    // Création de l'input
                    const input = document.createElement('input');
                    input.setAttribute("type", "text");
                    input.name = `form-${count}-answer_text`;
                    input.id = `form-${count}-answer_text`;
            
                    // Création du conteneur pour l'input
                    const containerInput = document.createElement('div');
                    containerInput.setAttribute("class", "form-group formset-item");
                    containerInput.appendChild(input);
            
                    // Insertion du nouvel élément dans le conteneur principal
                    containerChoiceForm.appendChild(containerInput);
            
                    // Incrémenter le total des formulaires et mettre à jour `totalForm.value`
                    count++
                    totalForm.value = count ;
                    value_forms_output.value = parseInt(totalForm);
                    console.log(value_forms_output);
                });
            </script>
            

        </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
