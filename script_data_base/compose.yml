services:
  db:
    image: postgres:16.0-alpine
    environment:
      - POSTGRES_USER=movie_user
      - POSTGRES_PASSWORD=movie_pass
    ports:
      - "5459:5432"
    volumes:
      - pg_data_movie:/var/lib/postgresql/data
      - ./init_script:/docker-entrypoint-initdb.d

volumes:
  pg_data_movie:
