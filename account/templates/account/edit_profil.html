{%extends 'base.html'%}

{%block content%}
{%include 'navebar.html'%}

<div class="container mt-5">
    <div class="row d-flex justify-content-center" style="margin: 100px auto 20px auto;">
        <div class="col-md-7">
            <div class="card p-3 py-4">
                 <form action="" method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    {% for error in form.non_field_errors %}
                        <p class="alert alert-danger">{{ error }}</p>
                    {% endfor %}

                    {% for message in messages %}
                        <p class="alert alert-info">{{ message }}</p>
                    {% endfor %}

                    <div class="form-group">
                        <label for="{{ form.first_name.id_for_label }}">Prénom</label>
                        <input type="text" name="first_name" value="{{form.first_name.value}}" id="{{ form.first_name.id_for_label }}" class="form-control" required>
                    </div>

                    <div class="form-group mt-3">
                        <label for="{{ form.last_name.id_for_label }}">Nom de famille</label>
                        <input type="text" name="last_name" value="{{form.last_name.value}}" id="{{ form.last_name.id_for_label }}" class="form-control" required>
                    </div>

                    <div class="form-group mt-3">
                        <label for="{{ form.email.id_for_label }}">Email</label>
                        <input type="email" name="email" value="{{form.email.value}}" id="{{ form.email.id_for_label }}" class="form-control" required>
                    </div>

                    <div class="form-group mt-3">
                        <label for="{{ form.profil.id_for_label }}">Photo de Profil</label>
                        {{form.profil}}
                    </div>

                    <div class="form-group mt-3">
                        <label for="{{ form.role.id_for_label }}">Role</label>
                        {{form.role}}
                    </div>

                    <div class="submit-buttom row">
                        <button type="submit" class="btn btn-success btn-block col m-3">Modifier</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{%endblock%}
