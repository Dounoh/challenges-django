{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'sondage/css/styles.css' %}" />
    <title>{% block title %} SondageApp {% endblock %}</title>
</head>
<body class="d-flex">

<header>
    <style>
        .navbar-styles {
            max-width: 16rem;
            height: 100vh;
            display: flex;
            flex-direction: column; 
            align-items: center; 
            background-color: rgba(223, 225, 228, 0.716);
            border-radius: 0px 20px 20px 0px;
        }
        .link-nav {
            display: block;
            font-size: 20px;
            text-decoration: none;
            text-transform: capitalize;
            color: rgb(0, 0, 0);
            background-color: rgb(223, 225, 228);
            padding: 10px 0px;
            margin: 5px auto;
            border-radius: 12px;
            width: 100%; 
            text-align: center; 
        }
        .link-nav:hover {
            box-shadow: 1px 1px 1px 1px rgba(39, 39, 39, 0.3);
        }
        .link-nav:active {
            color: blue;
        }
        .image-nav {
            width: 80px;
            height: 80px;
            border: 1px solid red;
            border-radius: 50%;
        }
        .nav-header {
            margin-bottom: 20px; 
        }
    </style>
    <nav class="navbar-styles">
        <div class="nav-header">
            <img src="" alt="" class="image-nav" />
            <h3>Account Info</h3>
        </div>
        <div class="nav-main">
            <a class="link-nav" href="">Accueil</a>
            <a class="link-nav" href="">Création de sondage</a>
            <a class="link-nav" href="">Voir résultats</a>
            <a class="link-nav" href="">Mes historiques</a>
            <a class="link-nav" href="">Les participants</a>
        </div>
    </nav>
</header>

<main class="d-flex flex-grow-1 justify-content-center align-items-center" style="padding: 20px;">
    {% block content %}
    {% endblock %}
</main>

<footer>
    <!-- contenu de pied de page ici -->
</footer>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
></script>
</body>
</html>
