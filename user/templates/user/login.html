{% extends "user/base.html" %}

{% block content %}
    <div class="container">
        <form action="" method="post">
            {%csrf_token%}
            {%for message in messages%}
                <p class="alert-danger">
                    {{message}}
                </p>
            {%endfor%}
            
            {%if form.erros%}
                {%for error in form.non_field_erros%}
                    <p class="alert alert-danger">
                        {{error}}
                    </p>
                {%endfor%}
            {%endif%}
            
            
            {{form.as_p}}
            <button type="submit">connexion</button>

        </form>
    </div>
{% endblock  %}
